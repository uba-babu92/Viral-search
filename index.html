<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viral Finder (proto)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1c1c1c; color: #eee; font-size: 16px; margin-bottom: 8px; font-family: inherit; }
  textarea { min-height: 110px; }
  button.main { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #3b82f6; color: #fff; font-size: 16px; }
  button.main:disabled { background: #333; color: #888; }
  button.plus { width: 46px; flex-shrink: 0; padding: 10px 0; border: 1px solid #333; border-radius: 8px; background: #1c1c1c; color: #eee; font-size: 22px; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .row input { margin-bottom: 0; }
  .small { font-size: 12px; color: #888; margin: 4px 0 12px; }
  .rubriques { display: flex; gap: 6px; margin: 12px 0; }
  .rubriques button { flex: 1; padding: 10px 4px; border-radius: 8px; border: 1px solid #333; background: #1c1c1c; color: #ccc; font-size: 14px; }
  .rubriques button.on { background: #eee; color: #111; border-color: #eee; }
  .modes { display: flex; gap: 8px; margin: 8px 0; }
  .modes button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #333; background: #1c1c1c; color: #ccc; font-size: 14px; }
  .modes button.on { background: #eee; color: #111; border-color: #eee; }
  .box { background: #1c1c1c; border-radius: 10px; padding: 12px; margin: 12px 0; font-size: 14px; }
  .box b { display: block; margin-bottom: 8px; }
  #myInfo { color: #facc15; margin: 6px 0 8px; font-size: 13px; }
  #status { margin: 12px 0; font-size: 14px; color: #aaa; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .rush { display: flex; align-items: center; gap: 8px; background: #1c1c1c; border-radius: 8px; padding: 6px; margin: 6px 0; }
  .rush .th { width: 48px; height: 64px; object-fit: cover; border-radius: 4px; background: #000; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .rush { transition: transform .15s; }
  .rush.drag { transition: none; position: relative; z-index: 2; background: #2a2a2a; box-shadow: 0 6px 20px #000a; }
  .rush .grip { width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #aaa; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .rush .n { font-weight: bold; width: 18px; text-align: center; }
  .rush .name { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rush button { width: 34px; height: 34px; border: 1px solid #333; border-radius: 6px; background: #111; color: #eee; font-size: 16px; padding: 0; }
  #apiWarn { color: #f87171; font-size: 12px; margin: -6px 0 8px; }
  .msg { background: #1c1c1c; border-radius: 10px; padding: 12px; margin: 8px 0; font-size: 14px; white-space: pre-wrap; }
  .msg.me { background: #1e3a8a; }
  .msg button { margin-top: 8px; padding: 6px 10px; border: 1px solid #444; border-radius: 6px; background: #111; color: #eee; }
  .tile { position: relative; aspect-ratio: 9 / 16; background: #222; border-radius: 6px; overflow: hidden; display: block; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .overlay { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000; }
  .analyse { position: absolute; bottom: 6px; left: 6px; right: 6px; padding: 5px; font-size: 12px; border: 0; border-radius: 6px; background: rgba(0,0,0,.7); color: #fff; }
  #panel { background: #1c1c1c; border-radius: 10px; padding: 12px; margin: 12px 0; font-size: 14px; line-height: 1.5; }
  #panel h2 { font-size: 16px; margin: 0 0 8px; }
  #panel .tag { color: #60a5fa; }
  details { margin-top: 16px; font-size: 12px; color: #888; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; color: #aaa; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>Viral Finder (proto)</h1>
<div id="apiWarn" class="hidden"></div>

<div class="rubriques">
  <button id="rubRecherche" class="on">Recherche</button>
  <button id="rubScript">Script</button>
  <button id="rubMontage">Montage</button>
</div>

<!-- ===== RECHERCHE ===== -->
<section id="secRecherche">
  <div class="row">
    <input id="query" type="text" placeholder="Thématique (ex : sneakers)">
    <button class="plus" id="plusBtn" title="Ajouter ma vidéo">+</button>
    <input id="myFile" type="file" accept="video/*" class="hidden">
  </div>

  <div id="boxMine" class="box hidden">
    <div id="myInfo"></div>
    <input id="myKeywords" type="text" placeholder="Mots-clés de ta vidéo (ex : cuisine rapide)">
    <button class="main" id="similar">Trouver les vidéos similaires</button>
  </div>

  <div class="modes" id="typeModes">
    <button id="typeVideos" class="on">Vidéos</button>
    <button id="typeCarrousels">Carrousels</button>
  </div>
  <button class="main" id="go">Chercher</button>
  <div id="status"></div>
  <div id="panel" class="hidden"></div>
  <div id="results"></div>
  <details id="raw" class="hidden"><summary>Données brutes (1er résultat)</summary><pre id="rawText"></pre></details>
</section>

<!-- ===== SCRIPT (vide pour l'instant) ===== -->
<section id="secScript" class="hidden">
  <textarea id="scriptText" placeholder="Colle ton script ici"></textarea>
  <input id="scriptAsk" type="text" placeholder="Ce que tu veux (ex : plus court, style TikTok, pour vendre)">
  <button class="main" id="scriptGo">Adapter</button>
  <div id="scriptStatus" class="small"></div>
  <div id="chat"></div>
</section>

<!-- ===== MONTAGE ===== -->
<section id="secMontage" class="hidden">
  <textarea id="montagePrompt">Sous-titres, texte à l'écran en gros, sans musique.</textarea>
  <input id="montageFile" type="file" accept="video/*" multiple class="hidden">
  <button class="main" id="montageAdd" style="background:#1c1c1c;border:1px solid #333;margin-bottom:8px">+ Ajouter des rushs</button>
  <div id="montageInfo" class="small"></div>
  <button class="main" id="montageGo" disabled>Lancer le montage</button>
  <div id="montageStatus" class="small">Choisis une vidéo, puis appuie sur le bouton.</div>
  <div id="montageResult"></div>
</section>

<script>
const VIDEO_ACTOR = "mu0i~tiktok-search-scraper";
const PHOTO_ACTOR = "scrapingmonkey~tiktok-scraper";
const RELAY = "https://viral-relais.v5nhskv7zy.workers.dev";
localStorage.removeItem("apifyToken"); // ancienne clé, plus utilisée

// Petit avertissement rouge quand un service n'a plus de crédit
const blocked = new Set();
function checkCredit(service, status, text) {
  const t = String(text).toLowerCase();
  if (status === 402 || status === 429 || /credit|quota|insufficient|limit exceeded|usage limit|payment|balance/.test(t)) {
    blocked.add(service);
    const w = document.getElementById("apiWarn");
    w.textContent = "⚠ Plus de crédit : " + [...blocked].join(", ");
    w.classList.remove("hidden");
  }
}

let items = [];
let myVideo = null;
let searchType = "videos";
let mineOpen = false;

// ----- Rubriques -----
function setRubrique(r) {
  const map = { recherche: "rubRecherche", script: "rubScript", montage: "rubMontage" };
  for (const k in map) document.getElementById(map[k]).classList.toggle("on", k === r);
  document.getElementById("secRecherche").classList.toggle("hidden", r !== "recherche");
  document.getElementById("secScript").classList.toggle("hidden", r !== "script");
  document.getElementById("secMontage").classList.toggle("hidden", r !== "montage");
}
document.getElementById("rubRecherche").addEventListener("click", () => setRubrique("recherche"));
document.getElementById("rubScript").addEventListener("click", () => setRubrique("script"));
document.getElementById("rubMontage").addEventListener("click", () => setRubrique("montage"));

// ----- Recherche : type Vidéos / Carrousels -----
function setType(t) {
  searchType = t;
  document.getElementById("typeVideos").classList.toggle("on", t === "videos");
  document.getElementById("typeCarrousels").classList.toggle("on", t === "carrousels");
}
document.getElementById("typeVideos").addEventListener("click", () => setType("videos"));
document.getElementById("typeCarrousels").addEventListener("click", () => setType("carrousels"));

// ----- « + » : ajouter ma vidéo à côté de la recherche -----
document.getElementById("plusBtn").addEventListener("click", () => document.getElementById("myFile").click());
document.getElementById("myFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const v = document.createElement("video");
  v.preload = "metadata";
  v.onloadedmetadata = () => {
    const orient = v.videoHeight > v.videoWidth ? "vertical" : v.videoWidth > v.videoHeight ? "horizontal" : "carré";
    myVideo = { duration: v.duration, width: v.videoWidth, height: v.videoHeight, size: f.size };
    document.getElementById("myInfo").textContent =
      `Durée ${fmtDuration(v.duration)} · ${v.videoWidth}×${v.videoHeight} (${orient}) · ${(f.size / 1e6).toFixed(1)} Mo`;
    document.getElementById("boxMine").classList.remove("hidden");
  };
  v.src = URL.createObjectURL(f);
});
document.getElementById("similar").addEventListener("click", () => {
  const kw = document.getElementById("myKeywords").value.trim();
  if (!kw) { document.getElementById("status").textContent = "Écris 2 ou 3 mots-clés pour ta vidéo."; return; }
  document.getElementById("query").value = kw;
  setType("videos");
  search(kw);
});

document.getElementById("go").addEventListener("click", () => search());
document.getElementById("query").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

// ----- Montage (via le relais Cloudflare, les clés n'apparaissent jamais ici) -----
const sleep = ms => new Promise(r => setTimeout(r, ms));
const mStatus = t => document.getElementById("montageStatus").textContent = t;

// Liste des rushs, dans l'ordre du montage
let rushes = [];
document.getElementById("montageAdd").addEventListener("click", () => document.getElementById("montageFile").click());
document.getElementById("montageFile").addEventListener("change", e => {
  rushes.push(...[...e.target.files].map(f => ({ file: f, url: URL.createObjectURL(f) })));
  e.target.value = ""; // permet de rajouter d'autres rushs ensuite
  drawRushes();
  makeThumbs();
});

// Petite image de chaque rush (dessinée une seule fois)
async function makeThumb(r) {
  if (r.thumb !== undefined) return;
  r.thumb = null;
  try {
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = r.url;
    await new Promise((ok, ko) => { v.onloadeddata = ok; v.onerror = ko; setTimeout(ko, 8000); v.load(); });
    v.currentTime = 0.1;
    await new Promise(ok => { v.onseeked = ok; setTimeout(ok, 3000); });
    const c = document.createElement("canvas");
    c.width = 96; c.height = Math.round(96 * (v.videoHeight / v.videoWidth || 16 / 9));
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    r.thumb = c.toDataURL("image/jpeg", 0.7);
    v.removeAttribute("src"); v.load();
  } catch (e) { /* pas d'image : on garde l'icône */ }
}
async function makeThumbs() {
  for (const r of rushes) {
    if (r.thumb === undefined) { await makeThumb(r); drawRushes(); }
  }
}

function drawRushes() {
  const box = document.getElementById("montageInfo");
  document.getElementById("montageGo").disabled = !rushes.length;
  box.innerHTML = rushes.length ? `<b>${rushes.length} rush(s). Glisse ☰ pour changer l'ordre.</b>` : "";
  rushes.forEach((r, i) => {
    const row = document.createElement("div");
    row.className = "rush";
    row.innerHTML = `<span class="n">${i + 1}</span>
      ${r.thumb ? `<img class="th" src="${r.thumb}" alt="">` : `<span class="th">🎬</span>`}
      <span class="name">${escapeHtml(r.file.name)}<br>${(r.file.size / 1e6).toFixed(1)} Mo</span>
      <button class="del">❌</button><span class="grip">☰</span>`;
    row.querySelector(".del").onclick = () => { URL.revokeObjectURL(r.url); rushes.splice(i, 1); drawRushes(); };
    row.querySelector(".grip").addEventListener("pointerdown", e => startDrag(e, row, i));
    box.appendChild(row);
  });
}

// Glisser-déposer avec la poignée ☰
function startDrag(e, row, from) {
  e.preventDefault();
  const box = document.getElementById("montageInfo");
  const rows = [...box.querySelectorAll(".rush")];
  const startY = e.clientY;
  let to = from;
  row.classList.add("drag");
  const grip = e.target;
  grip.setPointerCapture(e.pointerId);
  const move = ev => {
    row.style.transform = `translateY(${ev.clientY - startY}px)`;
    to = from;
    rows.forEach((o, j) => {
      if (o === row) return;
      const b = o.getBoundingClientRect(), mid = b.top + b.height / 2;
      if (j > from && ev.clientY > mid) to = Math.max(to, j);
      if (j < from && ev.clientY < mid) to = Math.min(to, j);
    });
    rows.forEach((o, j) => {
      if (o === row) return;
      const h = row.offsetHeight + 6;
      o.style.transform = (from < to && j > from && j <= to) ? `translateY(${-h}px)`
        : (from > to && j < from && j >= to) ? `translateY(${h}px)` : "";
    });
    // défile si on approche du bord de l'écran
    if (ev.clientY < 60) window.scrollBy(0, -10);
    if (ev.clientY > innerHeight - 60) window.scrollBy(0, 10);
  };
  const end = () => {
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", end);
    grip.removeEventListener("pointercancel", end);
    if (to !== from) rushes.splice(to, 0, rushes.splice(from, 1)[0]);
    drawRushes();
  };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
}

// Demande un rendu à Shotstack et attend la vidéo finale
async function render(srcs, captions) {
  const font = { family: "Montserrat ExtraBold", size: 64, color: "#ffffff", lineHeight: 0.9 };
  const background = { color: "#000000", opacity: 0.6, padding: 20, borderRadius: 16 };
  const videoTrack = { clips: srcs.map((src, i) => ({ asset: { type: "video", src }, start: i ? "auto" : 0, length: "auto", alias: `v${i}` })) };
  const captionTrack = { clips: srcs.map((_, i) => ({ asset: { type: "caption", src: `alias://v${i}`, font, background },
    start: `alias://v${i}`, length: `alias://v${i}`, position: "center" })) };
  mStatus("3/4 Montage demandé" + (captions ? " (avec sous-titres)…" : "…"));
  const r = await relay("/shotstack/render", {
    timeline: { tracks: captions ? [captionTrack, videoTrack] : [videoTrack] },
    output: { format: "mp4", size: { width: 1080, height: 1920 } }
  });
  for (let i = 0; i < 200; i++) {
    await sleep(4000);
    const st = (await relay("/shotstack/render/" + r.response.id)).response;
    mStatus("4/4 Rendu : " + st.status);
    if (st.status === "done") return st.url;
    if (st.status === "failed") throw new Error(st.error || "rendu échoué");
  }
  throw new Error("rendu trop long, réessaie");
}

async function relay(path, data) {
  const res = await fetch(RELAY + path, data === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
  });
  const txt = await res.text();
  if (!res.ok) { checkCredit("Shotstack", res.status, txt); throw new Error(`relais ${path} : ${res.status} ${txt.slice(0, 150)}`); }
  return JSON.parse(txt);
}

document.getElementById("montageGo").addEventListener("click", async () => {
  const files = rushes.map(r => r.file);
  const list = rushes.slice();
  let noCaption = false;
  const btn = document.getElementById("montageGo");
  if (!files.length) return;
  btn.disabled = true;
  document.getElementById("montageResult").innerHTML = "";
  try {
    // 1-2. Envoi de chaque vidéo chez Shotstack
    const srcs = [];
    for (let n = 0; n < files.length; n++) {
      const tag = `vidéo ${n + 1}/${files.length}`;
      if (list[n].src) { srcs.push(list[n].src); continue; } // déjà envoyée avant
      mStatus(`1/4 Préparation (${tag})…`);
      const up = await relay("/shotstack/upload", {});
      mStatus(`2/4 Envoi (${tag})…`);
      const put = await fetch(up.data.attributes.url, { method: "PUT", body: new Blob([files[n]]) });
      if (!put.ok) throw new Error("envoi vidéo : " + put.status);
      let src;
      for (let i = 0; i < 120; i++) {
        await sleep(3000);
        const a = (await relay("/shotstack/source/" + up.data.id)).data.attributes;
        mStatus(`2/4 Réception (${tag}) : ${a.status}`);
        if (a.status === "ready") { src = a.source; break; }
        if (a.status === "failed") throw new Error(`Shotstack n'a pas pu lire la ${tag}`);
      }
      if (!src) throw new Error("trop long, réessaie");
      list[n].src = src;
      srcs.push(src);
    }

    // 3-4. Montage, d'abord avec sous-titres. Si pas de voix : on refait sans.
    let url;
    try {
      url = await render(srcs, true);
    } catch (e) {
      if (!/spoken|speech|audio/i.test(e.message)) throw e;
      mStatus("Pas de voix trouvée : je refais le montage sans sous-titres…");
      url = await render(srcs, false);
      noCaption = true;
    }
    mStatus(noCaption ? "✅ Terminé (sans sous-titres : pas de voix détectée)." : "✅ Terminé !");
    document.getElementById("montageResult").innerHTML =
      `<video src="${url}" controls playsinline style="width:100%;border-radius:8px"></video>
       <a class="small" href="${url}" target="_blank" rel="noopener">Ouvrir / télécharger la vidéo</a>`;
    return;
  } catch (e) {
    mStatus("❌ " + e.message);
  } finally {
    btn.disabled = false;
  }
});

// ----- Script : petit chatbot IA (Vercel AI Gateway via le relais) -----
const AI_MODEL = "mistral/mistral-small";
const chat = [{ role: "system", content: "Tu es un expert en scripts de vidéos courtes virales (TikTok, Reels). Tu adaptes le script de l'utilisateur selon sa demande. Réponds en français, avec le script prêt à lire : accroche forte dans les 3 premières secondes, phrases courtes, texte à l'écran entre [crochets]. Pas de blabla autour." }];

function addMsg(text, me) {
  const d = document.createElement("div");
  d.className = "msg" + (me ? " me" : "");
  d.textContent = text;
  if (!me) {
    const b = document.createElement("button");
    b.textContent = "Copier";
    b.onclick = () => navigator.clipboard.writeText(text).then(() => b.textContent = "Copié ✅");
    d.appendChild(document.createElement("br"));
    d.appendChild(b);
  }
  document.getElementById("chat").appendChild(d);
  d.scrollIntoView({ behavior: "smooth" });
}

document.getElementById("scriptGo").addEventListener("click", async () => {
  const txt = document.getElementById("scriptText");
  const ask = document.getElementById("scriptAsk");
  const btn = document.getElementById("scriptGo");
  const st = document.getElementById("scriptStatus");
  const first = chat.length === 1;
  if (first && !txt.value.trim()) { st.textContent = "Colle d'abord ton script."; return; }
  if (!first && !ask.value.trim()) { st.textContent = "Écris ta correction dans la petite case."; return; }
  const content = first ? `Mon script :\n${txt.value.trim()}\n\nCe que je veux : ${ask.value.trim() || "rends-le plus viral"}` : ask.value.trim();
  chat.push({ role: "user", content });
  addMsg(first ? (ask.value.trim() || "Rends-le plus viral") : content, true);
  ask.value = "";
  btn.disabled = true;
  st.textContent = "L'IA écrit…";
  try {
    const res = await fetch(RELAY + "/ai", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: AI_MODEL, messages: chat })
    });
    const t = await res.text();
    if (!res.ok) { checkCredit("IA", res.status, t); throw new Error(res.status + " " + t.slice(0, 150)); }
    const answer = JSON.parse(t).choices[0].message.content;
    chat.push({ role: "assistant", content: answer });
    addMsg(answer, false);
    st.textContent = "Pas satisfait ? Écris une correction (ex : encore plus court) et appuie sur Adapter.";
    btn.textContent = "Envoyer la correction";
  } catch (e) {
    chat.pop();
    st.textContent = "❌ " + e.message;
  } finally {
    btn.disabled = false;
  }
});

// ----- Appels Apify (via le relais, la clé reste dans Cloudflare) -----
async function runActor(actor, input) {
  const res = await fetch(`${RELAY}/apify/${actor}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(input)
  });
  if (!res.ok) {
    const t = await res.text();
    checkCredit("Apify", res.status, t);
    throw new Error(actor + " : erreur " + res.status + " " + t.slice(0, 150));
  }
  return res.json();
}

async function search(qArg) {
  const q = (typeof qArg === "string" ? qArg : document.getElementById("query").value).trim();
  const status = document.getElementById("status");
  document.getElementById("results").innerHTML = "";
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("raw").classList.add("hidden");
  if (!q) { status.textContent = "Mets une thématique."; return; }
  status.textContent = "Recherche en cours (30 à 60 s)...";

  try {
    if (searchType === "videos") {
      const data = await runActor(VIDEO_ACTOR, { queries: [q], maxVideos: 30 });
      showRaw(data[0]);
      items = data.map(normalize).filter(v => v.views > 0).sort((a, b) => b.views - a.views);
    } else {
      const data = await runActor(PHOTO_ACTOR, { mode: "searchPhotos", searchTerms: [q], maxResults: 30, country: "FR" });
      showRaw(data[0]);
      items = data.map(normalizePhoto).sort((a, b) => b.views - a.views);
    }
    status.textContent = items.length + " résultat(s), triés par vues.";
    render(items);
  } catch (err) {
    status.textContent = "Échec : " + err.message;
  }
}

function showRaw(first) {
  if (!first) return;
  document.getElementById("rawText").textContent = JSON.stringify(first, null, 2).slice(0, 3000);
  document.getElementById("raw").classList.remove("hidden");
}

// Les noms de champs varient selon les scrapers : on teste plusieurs variantes.
function normalize(v) {
  const created = v.createTimeISO ?? v.createTime ?? v.create_time ?? null;
  const text = v.text ?? v.desc ?? "";
  return {
    views: Number(v.playCount ?? v.stats?.playCount ?? v.plays ?? v.play_count ?? 0),
    likes: Number(v.diggCount ?? v.stats?.diggCount ?? v.likeCount ?? v.likes ?? 0),
    duration: Number(v.videoMeta?.duration ?? v.video?.duration ?? v.duration ?? 0),
    date: created,
    text: text,
    hashtags: [...new Set((text.match(/#[\p{L}\p{N}_]+/gu) || []).map(h => h.toLowerCase()))],
    music: v.musicMeta?.musicName ?? v.music?.title ?? "",
    url: v.webVideoUrl ?? v.url ?? "#",
    cover: v.videoMeta?.coverUrl ?? v.video?.cover ?? v.covers?.[0] ?? v.coverUrl ?? v.cover ?? v.thumbnail ?? ""
  };
}

// Carrousels : on cherche toutes les URLs d'images dans la réponse, quel que soit le nom du champ.
const IMG_RE = /^https?:\/\/.*(\.jpe?g|\.webp|\.png|tiktokcdn|byteimg|p16-|p19-|p77-)/i;
function findImageUrls(obj, out = []) {
  if (typeof obj === "string") { if (IMG_RE.test(obj)) out.push(obj); }
  else if (Array.isArray(obj)) obj.forEach(x => findImageUrls(x, out));
  else if (obj && typeof obj === "object") Object.values(obj).forEach(x => findImageUrls(x, out));
  return [...new Set(out)];
}

function normalizePhoto(p) {
  const imgs = findImageUrls(p);
  return {
    views: Number(p.playCount ?? p.stats?.playCount ?? p.plays ?? 0),
    likes: Number(p.diggCount ?? p.stats?.diggCount ?? p.likeCount ?? p.likes ?? 0),
    date: p.createTimeISO ?? p.createTime ?? p.create_time ?? null,
    count: imgs.length,
    url: p.webVideoUrl ?? p.url ?? p.shareUrl ?? "#",
    cover: imgs[0] ?? ""
  };
}

function fmtNum(n) {
  return n >= 1e6 ? (n / 1e6).toFixed(1) + " M" : n >= 1e3 ? (n / 1e3).toFixed(1) + " k" : String(n);
}

function fmtDuration(s) {
  if (!s) return "";
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return m + ":" + String(r).padStart(2, "0");
}

function fmtDate(d) {
  if (!d) return "";
  const date = typeof d === "number" ? new Date(d * 1000) : new Date(d);
  if (isNaN(date)) return "";
  return date.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "2-digit" });
}

function render(list) {
  const results = document.getElementById("results");
  const isCarousel = searchType === "carrousels";
  results.innerHTML = '<div class="grid">' + list.map((v, i) => {
    const sameLength = !isCarousel && myVideo && Math.abs(v.duration - myVideo.duration) <= 3;
    const lines = isCarousel
      ? `<span>👁 ${fmtNum(v.views)}</span><span>🖼 ${v.count}</span><span>${fmtDate(v.date)}</span><span>♥ ${fmtNum(v.likes)}</span>`
      : `<span>👁 ${fmtNum(v.views)}</span><span>${fmtDuration(v.duration)}${sameLength ? " ✓" : ""}</span><span>${fmtDate(v.date)}</span><span>♥ ${fmtNum(v.likes)}</span>`;
    const btn = isCarousel ? "" : `<button class="analyse" onclick="analyse(${i})">Analyser le style</button>`;
    return `
    <div class="tile">
      <a href="${v.url}" target="_blank" rel="noopener" style="position:absolute;inset:0"></a>
      ${v.cover ? `<img src="${v.cover}" alt="" referrerpolicy="no-referrer">` : ""}
      <div class="overlay">${lines}</div>
      ${btn}
    </div>`;
  }).join("") + "</div>";
  if (!list.length) results.innerHTML = "<div>Aucun résultat.</div>";
}

// Analyse : stats de la vidéo + vidéos similaires déjà trouvées (même hashtag ou durée proche).
function analyse(idx) {
  const v = items[idx];
  const similar = items.filter((o, j) => j !== idx && (
    o.hashtags.some(h => v.hashtags.includes(h)) || Math.abs(o.duration - v.duration) <= 3
  )).slice(0, 6);
  const words = v.text.replace(/#[\p{L}\p{N}_]+/gu, "").trim().split(/\s+/).filter(Boolean).length;
  const panel = document.getElementById("panel");
  panel.classList.remove("hidden");
  panel.innerHTML = `
    <h2>Style de la vidéo</h2>
    <div>Durée : <b>${fmtDuration(v.duration) || "inconnue"}</b></div>
    <div>Vues : <b>${fmtNum(v.views)}</b> · Likes : <b>${fmtNum(v.likes)}</b></div>
    <div>Légende : <b>${words}</b> mots</div>
    <div>Hashtags : ${v.hashtags.map(h => `<span class="tag">${h}</span>`).join(" ") || "aucun"}</div>
    <div>Musique : ${escapeHtml(v.music) || "inconnue"}</div>
    <h2 style="margin-top:12px">Vidéos au même style (${similar.length})</h2>
    <div class="grid">${similar.map(o => `
      <a class="tile" href="${o.url}" target="_blank" rel="noopener">
        ${o.cover ? `<img src="${o.cover}" alt="">` : ""}
        <div class="overlay"><span>👁 ${fmtNum(o.views)}</span></div>
      </a>`).join("") || "<div>Aucune vidéo similaire dans les résultats.</div>"}</div>`;
  panel.scrollIntoView({ behavior: "smooth" });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
